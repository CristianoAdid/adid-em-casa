<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174a70"><link rel="manifest" href="manifest.json"><title>ADID em Casa</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#17374c;font:18px system-ui}main{max-width:680px;margin:auto;padding:20px}header{background:#174a70;color:white;padding:24px;border-radius:18px}h1{margin:0;font-size:28px}h2{font-size:23px}button{font:inherit;cursor:pointer;border:2px solid #b5cbd8;border-radius:14px;background:white;color:#17374c;padding:16px;min-height:56px}button:focus-visible{outline:4px solid #e8a334}button.primary{background:#174a70;color:white;border:0}#levels{display:grid;gap:10px}#levels button{text-align:left}#sample{background:white;border-radius:20px;text-align:center;font-size:clamp(42px,12vw,76px);padding:28px;margin:16px 0}#choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#choices button{font-size:clamp(17px,5vw,36px);padding:16px 3px;overflow-wrap:anywhere;min-height:90px}#choices .yes{background:#d4f1dc;border-color:#258448}#choices .no{background:#fff0d9;border-color:#d28a20}#feedback{min-height:50px;text-align:center;font-weight:bold}progress{width:100%;accent-color:#258448}footer{font-size:13px;margin-top:24px} [hidden]{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style></head><body><main><header><h1>ADID em Casa</h1>Aprendendo a ler · piloto</header><section id="home"><h2>Escolha sua lição</h2><div id="levels"></div><p id="recommend"></p><div class="row"><button id="history">Histórico</button><button id="export">Exportar CSV</button></div></section><section id="game" hidden><div class="row"><button id="back">Voltar</button><button id="audio">🔊 Ouvir instrução</button></div><p id="counter"></p><progress id="progress" max="10" value="0"></progress><div id="sample"></div><p id="instruction" style="text-align:center"></p><div id="choices"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary" hidden>Continuar</button></section><section id="done" hidden><h2>Parabéns! Lição concluída!</h2><p id="summary"></p><button class="primary" id="finish">Voltar às lições</button></section><section id="records" hidden><h2>Histórico neste aparelho</h2><div id="entries"></div><button id="closeHistory">Voltar</button></section><footer>Atividade pedagógica experimental. Não é teste diagnóstico. Dados de desempenho ficam neste navegador. Imagens ilustrativas por emojis.</footer></main><script>
const $=id=>document.getElementById(id), names=['Imagens iguais','Imagens relacionadas','Letras iguais','Sílabas iguais','Palavras iguais','Palavras e imagens'];
const bank=[['BOLA','⚽'],['GATO','🐱'],['PATO','🦆'],['SAPO','🐸'],['CASA','🏠'],['UVA','🍇'],['MAÇÃ','🍎'],['BANANA','🍌'],['CARRO','🚗'],['PEIXE','🐟'],['FLOR','🌷'],['SOL','☀️'],['LUA','🌙'],['BOLO','🎂'],['MÃO','✋'],['PÉ','🦶'],['RATO','🐭'],['VACA','🐄'],['PORCO','🐷'],['CÃO','🐶'],['PÃO','🍞'],['OVO','🥚'],['LEÃO','🦁'],['TREM','🚆'],['AVIÃO','✈️'],['BARCO','⛵'],['LIVRO','📕'],['COPO','🥛'],['CHAVE','🔑'],['DADO','🎲']];
const related=[['🐕','🐶'],['🐈','🐱'],['🚘','🚗'],['🏡','🏠'],['🌕','🌙'],['🌻','🌷'],['🍏','🍎'],['📗','📕'],['🚄','🚆'],['🛩️','✈️']];const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), syll=['BA','BE','BI','BO','BU','PA','PE','PI','PO','PU','MA','ME','MI','MO','MU','LA','LE','LI','LO','LU','TA','TE','TI','TO','TU'];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function load(){try{return JSON.parse(localStorage.getItem('adid-v1')||'[]')}catch{return []}}let history=load(),level=0,trials=[],index=0,attempts=[],start=0,locked=false,details=[];function screen(id){for(const x of ['home','game','done','records'])$(x).hidden=x!==id}function speak(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';speechSynthesis.speak(u)}}function make(l){let pool=l===1?related:l===2?letters:l===3?syll:bank;return shuffle(pool).slice(0,10).map((v,i)=>{let sample,answer,options,inst='Toque na opção igual.';if(l===1){sample=v[0];answer=v[1];options=pool.map(x=>x[1]);inst='Toque na figura que representa a mesma coisa.'}else if(l===2||l===3){sample=answer=v;options=pool}else if(l===0||l===4){let k=l===0?1:0;sample=answer=v[k];options=pool.map(x=>x[k])}else{let k=i%2;sample=v[k];answer=v[1-k];options=pool.map(x=>x[1-k]);inst=k?'Toque na palavra correspondente.':'Toque na figura correspondente.'}return {sample,answer,options:shuffle([answer,...shuffle(options.filter(x=>x!==answer)).slice(0,2)]),inst}})}function home(){screen('home');let suggested=0;for(let l=0;l<5;l++){let h=history.filter(x=>x.level===l).slice(-3);if(h.length===3&&h.every(x=>x.first>=9)&&suggested===l)suggested++} $('recommend').textContent='Nível sugerido: '+(suggested+1)+' – '+names[suggested]+'. Todos os níveis estão disponíveis.'}names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' · '+n;b.onclick=()=>{level=i;trials=make(i);index=0;details=[];screen('game');render()};$('levels').append(b)});function render(){let t=trials[index];locked=false;attempts=[];start=performance.now();$('counter').textContent=names[level]+' · '+(index+1)+' de 10';$('progress').value=index;$('sample').textContent=t.sample;$('instruction').textContent=t.inst;$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();t.options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(locked)return;attempts.push({choice:v,ms:Math.round(performance.now()-start)});if(v===t.answer){locked=true;b.className='yes';$('feedback').textContent='Muito bem!';$('next').hidden=false;details.push({sample:t.sample,answer:t.answer,attempts:[...attempts]})}else{b.className='no';$('feedback').textContent='Vamos tentar novamente!'}};$('choices').append(b)})} $('audio').onclick=()=>speak(trials[index].inst);$('next').onclick=()=>{if(!locked)return;if(++index<10){render();return}let first=details.filter(x=>x.attempts.length===1).length;history.push({date:new Date().toISOString(),level,first,details});let saved=true;try{localStorage.setItem('adid-v1',JSON.stringify(history))}catch{saved=false}$('summary').textContent='Você completou 10 atividades! Acertos na primeira tentativa: '+first+'/10.'+(saved?'':' Atenção: histórico não salvo no navegador.');screen('done')};$('back').onclick=()=>{if(confirm('Sair desta lição? A sessão incompleta não será registrada.'))home()};$('finish').onclick=home;$('closeHistory').onclick=home;$('history').onclick=()=>{$('entries').replaceChildren();if(!history.length)$('entries').textContent='Nenhuma sessão concluída.';history.slice().reverse().forEach(h=>{let p=document.createElement('p');p.textContent=new Date(h.date).toLocaleString('pt-BR')+' · '+names[h.level]+' · '+h.first+'/10 acertos iniciais';$('entries').append(p)});screen('records')};$('export').onclick=()=>{let rows=[['sessao','data','nivel','item','modelo','resposta_correta','tentativa','escolha','latencia_acumulada_ms','acerto']];history.forEach((h,s)=>h.details.forEach((d,i)=>d.attempts.forEach((a,j)=>rows.push([s+1,h.date,h.level+1,i+1,d.sample,d.answer,j+1,a.choice,a.ms,Number(a.choice===d.answer)]))));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='adid_resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};home();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
